# Stage environment for BiatecOIDC - deployed automatically by .github/workflows/deploy-stage.yml on
# every push to master. Lives in the same "biatec" namespace as production (k8s/main/deployment-oidc.yaml)
# but under entirely distinct resource names/host/ConfigMap, so it can never collide with or be confused
# for the production Deployment/Service/Ingress. See docs/CICD_GITHUB_ACTIONS.md for the full pipeline
# and docs/STAGE_ENVIRONMENT.md for what is (and isn't) isolated between stage and production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biatec-oidc-stage-app-deployment
  namespace: biatec
spec:
  selector:
    matchLabels:
      app: biatec-oidc-stage-app
  replicas: 1
  template:
    metadata:
      labels:
        app: biatec-oidc-stage-app
    spec:
      containers:
        - name: biatec-oidc-stage-app
          image: scholtz2/biatec-oidc:1.2026.08.02-main
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: "150Mi"
            limits:
              cpu: 1000m
              memory: "500Mi"
          ports:
            - containerPort: 5443
              protocol: TCP
          envFrom:
            # Dedicated stage secret, deliberately separate from production's
            # google-account-main-app-secret - see docs/STAGE_ENVIRONMENT.md and
            # k8s/stage/generate-stage-secret.sh (one-time manual setup, not something CI creates).
            - secretRef:
                name: biatec-stage-app-secret
          env:
            - name: ASPNETCORE_Kestrel__Certificates__Default__Path
              value: /https/cert.pfx
            - name: ASPNETCORE_Kestrel__Certificates__Default__Password
              valueFrom:
                secretKeyRef:
                  name: csharp-cert-password
                  key: password
            - name: ASPNETCORE_Kestrel__Endpoints__Https__Url
              value: https://biatec-oidc-stage-app-deployment.biatec:5443
          readinessProbe:
            tcpSocket:
              port: 5443
            initialDelaySeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: 5443
            initialDelaySeconds: 20
            timeoutSeconds: 5
            failureThreshold: 2
            terminationGracePeriodSeconds: 1
          volumeMounts:
            - name: biatec-oidc-stage-conf
              mountPath: /app/appsettings.json
              subPath: appsettings.json
            - name: https-cert
              mountPath: /https
              readOnly: true
      volumes:
        - name: biatec-oidc-stage-conf
          configMap:
            name: biatec-oidc-stage-conf
        - name: https-cert
          secret:
            secretName: csharp-cert
---
apiVersion: v1
kind: Service
metadata:
  name: biatec-oidc-stage-service
  namespace: biatec
spec:
  type: ClusterIP
  selector:
    app: biatec-oidc-stage-app
  ports:
    - name: https
      protocol: TCP
      appProtocol: https
      port: 5443
      targetPort: 5443
---
# Full catch-all straight to biatec-oidc-stage-service, same regex-path + rewrite-target idiom as
# biatec-oidc-domain-ingress in k8s/main/deployment-oidc.yaml. stage.oidc.biatec.io is dedicated
# entirely to this deployment, so (unlike production's split alias on google.biatec.io) no path
# carve-out or second Ingress object is needed here - there is no legacy stage host to keep working.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biatec-oidc-stage-ingress
  namespace: biatec
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    # Required for the regex path (`/(.*)`) below. Also requires pathType: ImplementationSpecific on
    # that path, not Prefix - Prefix means a literal path-segment match per the Ingress spec, so
    # ingress-nginx's admission webhook rejects a regex there even with this annotation set
    # ("path /(.*) cannot be used with pathType Prefix").
    nginx.ingress.kubernetes.io/use-regex: "true"
    # The OIDC handlers' auth cookie carries the signed-in user's Google/Microsoft tokens
    # (SaveTokens), which with the drive.file/AppFolder scope grants can exceed nginx's default
    # response header buffer - without this, the callback (POST /oidc/signin-google or
    # /oidc/signin-microsoft) 502s with "upstream sent too big header while reading response
    # header from upstream" right after a successful sign-in. Same value already used by
    # biatec-mcp-ingress/biatec-mcp-stage-ingress for the same underlying reason.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - stage.oidc.biatec.io
      secretName: tls-stage.oidc.biatec.io
  rules:
    - host: stage.oidc.biatec.io
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: biatec-oidc-stage-service
                port:
                  number: 5443
