apiVersion: apps/v1
kind: Deployment
metadata:
  name: biatec-mcp-app-deployment
  namespace: biatec
spec:
  selector:
    matchLabels:
      app: biatec-mcp-app
  replicas: 1
  template:
    metadata:
      labels:
        app: biatec-mcp-app
    spec:
      containers:
        - name: biatec-mcp-app
          image: scholtz2/biatec-mcp:1.2026.07.24-main
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 200m
              memory: "200Mi"
            limits:
              cpu: 2000m
              memory: "1000Mi"
          ports:
            - containerPort: 5443
              protocol: TCP
          envFrom:
            - secretRef:
                name: google-account-main-app-secret
          env:
            - name: ASPNETCORE_Kestrel__Certificates__Default__Path
              value: /https/cert.pfx
            - name: ASPNETCORE_Kestrel__Certificates__Default__Password
              valueFrom:
                secretKeyRef:
                  name: csharp-cert-password
                  key: password
            - name: ASPNETCORE_Kestrel__Endpoints__Https__Url
              value: https://biatec-mcp-app-deployment.biatec:5443
          readinessProbe:
            tcpSocket:
              port: 5443
            initialDelaySeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: 5443
            initialDelaySeconds: 20
            timeoutSeconds: 5
            failureThreshold: 2
            terminationGracePeriodSeconds: 1
          volumeMounts:
            - name: biatec-mcp-conf
              mountPath: /app/appsettings.json
              subPath: appsettings.json
            - name: https-cert
              mountPath: /https
              readOnly: true
      volumes:
        - name: biatec-mcp-conf
          configMap:
            name: biatec-mcp-conf
        - name: https-cert
          secret:
            secretName: csharp-cert
---
apiVersion: v1
kind: Service
metadata:
  name: biatec-mcp-service
  namespace: biatec
spec:
  type: ClusterIP
  selector:
    app: biatec-mcp-app
  ports:
    - name: https
      protocol: TCP
      appProtocol: https
      port: 5443
      targetPort: 5443

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biatec-mcp-ingress
  namespace: biatec
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    # Required for the regex path (`/(.*)`) below. Also requires pathType: ImplementationSpecific on
    # that path, not Prefix - Prefix means a literal path-segment match per the Ingress spec, so
    # ingress-nginx's admission webhook rejects a regex there even with this annotation set
    # ("path /(.*) cannot be used with pathType Prefix").
    nginx.ingress.kubernetes.io/use-regex: "true"

    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.org/websocket-services: "biatec-mcp-service"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - google.biatec.io
      secretName: tls-google.biatec.io
  rules:
    - host: google.biatec.io
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: biatec-mcp-service
                port:
                  number: 5443
---
# Dedicated host for BiatecMCP, same pattern as biatec-oidc-domain-ingress in
# k8s/main/deployment-oidc.yaml: BiatecMCP's canonical resource identity (RFC 9728/RFC 8707 - see
# BiatecMCP/Program.cs's OAuth resource-server wiring and Mcp:CanonicalResourceUri config) is now
# https://mcp.biatec.io/tools, not google.biatec.io/tools - kept as a separate Ingress object (not an
# extra host block on biatec-mcp-ingress above) for the same reason biatec-oidc-domain-ingress is
# separate: this object's own path/host pairing is unrelated to the shared google.biatec.io catch-all,
# so there is no rewrite-target conflict to avoid here, but keeping the two Ingress objects/hosts
# distinct mirrors the rest of this repo's convention and keeps each host's cert/rule fully independent.
# google.biatec.io keeps working as a legacy alias (biatec-mcp-ingress above) - nothing here removes it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biatec-mcp-domain-ingress
  namespace: biatec
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.org/websocket-services: "biatec-mcp-service"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - mcp.biatec.io
      secretName: tls-mcp.biatec.io
  rules:
    - host: mcp.biatec.io
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: biatec-mcp-service
                port:
                  number: 5443
