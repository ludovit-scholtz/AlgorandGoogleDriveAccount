name: Build and Deploy API
on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  IMAGE_MCP: scholtz2/biatec-mcp
  IMAGE_OIDC: scholtz2/biatec-oidc
  NAMESPACE: biatec

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same versioning scheme historically used by deploy.sh: 1.<year>.<month>.<day>-main
      - name: Compute version
        id: version
        run: |
          ver="1.$(date -u '+%Y').$(date -u '+%m').$(date -u '+%d')"
          version="$ver-main"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed version: $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push BiatecMCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: BiatecMCP/Dockerfile
          push: true
          tags: ${{ env.IMAGE_MCP }}:${{ steps.version.outputs.version }}

      - name: Build and push BiatecOIDC image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: BiatecOIDC/Dockerfile
          push: true
          tags: ${{ env.IMAGE_OIDC }}:${{ steps.version.outputs.version }}

      - name: Update deployment manifests with new image tags
        run: |
          sed -i "s~${IMAGE_MCP}.*~${IMAGE_MCP}:${{ steps.version.outputs.version }}~g" k8s/main/deployment-mcp.yaml
          sed -i "s~${IMAGE_OIDC}.*~${IMAGE_OIDC}:${{ steps.version.outputs.version }}~g" k8s/main/deployment-oidc.yaml

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- k8s/main/deployment-mcp.yaml k8s/main/deployment-oidc.yaml; then
            git add k8s/main/deployment-mcp.yaml k8s/main/deployment-oidc.yaml
            git commit -m "cicd deploy ${{ steps.version.outputs.version }} [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((i * 3))
            done
          else
            echo "No manifest changes to commit"
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/main/deployment-mcp.yaml -n "$NAMESPACE"
          kubectl apply -f k8s/main/deployment-oidc.yaml -n "$NAMESPACE"

      - name: Update config maps
        run: |
          kubectl delete configmap biatec-mcp-conf -n "$NAMESPACE" --ignore-not-found
          kubectl create configmap biatec-mcp-conf --from-file=k8s/main/conf-mcp -n "$NAMESPACE"
          kubectl delete configmap biatec-oidc-conf -n "$NAMESPACE" --ignore-not-found
          kubectl create configmap biatec-oidc-conf --from-file=k8s/main/conf-oidc -n "$NAMESPACE"

      - name: Roll out deployments
        run: |
          kubectl rollout restart deployment/biatec-mcp-app-deployment -n "$NAMESPACE"
          kubectl rollout status deployment/biatec-mcp-app-deployment -n "$NAMESPACE"
          kubectl rollout restart deployment/biatec-oidc-app-deployment -n "$NAMESPACE"
          kubectl rollout status deployment/biatec-oidc-app-deployment -n "$NAMESPACE"

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"
