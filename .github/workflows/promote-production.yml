name: Promote to Production

# Manually-triggered only - this workflow never runs on push. It does NOT build anything: it takes an
# image tag that deploy-stage.yml already built, pushed, and deployed to stage, and re-deploys that
# exact same image to production (k8s/main/*). Run it from the Actions tab ("Run workflow") once a
# version has been tested in stage by humans/other projects and is ready for mainnet. See
# docs/CICD_GITHUB_ACTIONS.md and docs/STAGE_ENVIRONMENT.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to promote (e.g. 1.2026.07.28-main). Leave EMPTY (default) to promote whatever image tag is currently deployed to stage, as recorded in k8s/stage/deployment-*-stage.yaml"
        required: false
        default: ""
        type: string
      service:
        description: "Which service(s) to promote"
        required: true
        type: choice
        options:
          - both
          - mcp
          - oidc
        default: both

permissions:
  contents: write

env:
  IMAGE_MCP: scholtz2/biatec-mcp
  IMAGE_OIDC: scholtz2/biatec-oidc
  NAMESPACE: biatec

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # An explicit `version` input wins and is used for both services. Otherwise each service's tag is
      # read from its stage manifest - deploy-stage.yml commits the tag it just deployed there on every
      # push to master, so those files are the source of truth for "what is currently in stage".
      - name: Resolve image tag(s) to promote
        id: resolve
        run: |
          input="${{ inputs.version }}"
          mcp_version="$input"
          oidc_version="$input"
          if [[ -z "$input" ]]; then
            mcp_version=$(grep -oP "${IMAGE_MCP}:\K[^\s\"']+" k8s/stage/deployment-mcp-stage.yaml | head -n1)
            oidc_version=$(grep -oP "${IMAGE_OIDC}:\K[^\s\"']+" k8s/stage/deployment-oidc-stage.yaml | head -n1)
            echo "No version given - using the tags currently deployed to stage"
          fi
          pattern='^[0-9]+\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}-.+$'
          for v in "$mcp_version" "$oidc_version"; do
            if [[ ! "$v" =~ $pattern ]]; then
              echo "::error::'$v' doesn't look like a version produced by deploy-stage.yml (expected e.g. 1.2026.07.28-main). Double-check it before promoting."
              exit 1
            fi
          done
          echo "mcp_version=$mcp_version" >> "$GITHUB_OUTPUT"
          echo "oidc_version=$oidc_version" >> "$GITHUB_OUTPUT"
          echo "Promoting mcp=$mcp_version oidc=$oidc_version (service: ${{ inputs.service }})"

      - name: Update production manifest(s) with the promoted image tag
        run: |
          if [[ "${{ inputs.service }}" == "both" || "${{ inputs.service }}" == "mcp" ]]; then
            sed -i "s~${IMAGE_MCP}.*~${IMAGE_MCP}:${{ steps.resolve.outputs.mcp_version }}~g" k8s/main/deployment-mcp.yaml
          fi
          if [[ "${{ inputs.service }}" == "both" || "${{ inputs.service }}" == "oidc" ]]; then
            sed -i "s~${IMAGE_OIDC}.*~${IMAGE_OIDC}:${{ steps.resolve.outputs.oidc_version }}~g" k8s/main/deployment-oidc.yaml
          fi

      - name: Commit updated production manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- k8s/main/deployment-mcp.yaml k8s/main/deployment-oidc.yaml; then
            git add k8s/main/deployment-mcp.yaml k8s/main/deployment-oidc.yaml
            git commit -m "cicd promote mcp=${{ steps.resolve.outputs.mcp_version }} oidc=${{ steps.resolve.outputs.oidc_version }} (${{ inputs.service }}) to production [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((i * 3))
            done
          else
            echo "No manifest changes to commit"
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      # Must run BEFORE "Apply Kubernetes manifests": on a brand-new Deployment, `kubectl apply`
      # schedules its Pods immediately, so if the ConfigMap a Pod's volume mounts doesn't exist yet,
      # the Pod fails to start (MountVolume.SetUp failed: configmap "..." not found). Creating/updating
      # the ConfigMap first guarantees it always exists before any Pod that mounts it is scheduled -
      # whether that's the first-ever apply of a new Deployment or a later rollout restart. Uses
      # `apply` (via `--dry-run=client -o yaml | kubectl apply -f -`) instead of `delete` + `create` so
      # there's never a window where the ConfigMap doesn't exist at all.
      - name: Update production config maps
        run: |
          if [[ "${{ inputs.service }}" == "both" || "${{ inputs.service }}" == "mcp" ]]; then
            kubectl create configmap biatec-mcp-conf --from-file=k8s/main/conf-mcp -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          fi
          if [[ "${{ inputs.service }}" == "both" || "${{ inputs.service }}" == "oidc" ]]; then
            kubectl create configmap biatec-oidc-conf --from-file=k8s/main/conf-oidc -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Apply Kubernetes manifests (production)
        run: |
          if [[ "${{ inputs.service }}" == "both" || "${{ inputs.service }}" == "mcp" ]]; then
            kubectl apply -f k8s/main/deployment-mcp.yaml -n "$NAMESPACE"
          fi
          if [[ "${{ inputs.service }}" == "both" || "${{ inputs.service }}" == "oidc" ]]; then
            kubectl apply -f k8s/main/deployment-oidc.yaml -n "$NAMESPACE"
          fi

      - name: Roll out production deployments
        run: |
          if [[ "${{ inputs.service }}" == "both" || "${{ inputs.service }}" == "mcp" ]]; then
            kubectl rollout restart deployment/biatec-mcp-app-deployment -n "$NAMESPACE"
            kubectl rollout status deployment/biatec-mcp-app-deployment -n "$NAMESPACE"
          fi
          if [[ "${{ inputs.service }}" == "both" || "${{ inputs.service }}" == "oidc" ]]; then
            kubectl rollout restart deployment/biatec-oidc-app-deployment -n "$NAMESPACE"
            kubectl rollout status deployment/biatec-oidc-app-deployment -n "$NAMESPACE"
          fi

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"
